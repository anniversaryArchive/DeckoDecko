name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행 (PR 없이 확인용)

# 워크플로가 저장소를 읽기만 하도록 토큰 권한을 최소로 제한한다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  check:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # package.json 의 packageManager(pnpm@10.x) 를 그대로 사용
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: Lint + Typecheck (turbo)
        run: pnpm turbo run lint typecheck

      - name: Build (turbo)
        run: pnpm turbo run build

      - name: Expo doctor (SDK · 패키지 버전 정합성)
        run: pnpm --filter @deckodecko/mobile doctor

      # 시뮬레이터 없이 Metro 번들을 끝까지 돌려 import 경로·라우트 파일 규칙·네이티브 모듈 설정 오류를 잡는다.
      # 웹은 출시 대상이 아니다. 이 단계는 번들 검증용이다.
      - name: Expo web bundle (Metro 검증)
        run: pnpm --filter @deckodecko/mobile exec expo export --platform web --output-dir dist
