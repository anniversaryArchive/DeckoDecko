name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행 (PR 없이 확인용)

# 워크플로가 저장소를 읽기만 하도록 토큰 권한을 최소로 제한한다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  check:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # package.json 의 packageManager(pnpm@10.x) 를 그대로 사용
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: Lint + Typecheck (turbo)
        run: pnpm turbo run lint typecheck

      - name: Build (turbo)
        run: pnpm turbo run build

      # 패키지 버전 비교는 실행 시점에 Expo 서버의 최신 권장 버전과 맞춰 보므로, 레포가 그대로여도 Expo 가 패치를 내면 깨진다.
      # 그 검사 하나만 빼고 나머지 doctor 검사(설정 · 중복 의존성 등)는 계속 막는다.
      - name: Expo doctor (버전 비교 제외)
        run: pnpm --filter @deckodecko/mobile run doctor
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"

      # 빠진 버전 비교는 여기서 따로 보고 경고만 남긴다 (PR 체크 화면에 어노테이션으로 보임). 맞추려면 `expo install --fix`.
      - name: Expo 패키지 버전 (경고만)
        run: |
          if ! pnpm --filter @deckodecko/mobile exec expo install --check; then
            echo "::warning title=Expo 패키지 버전::Expo SDK 권장 버전보다 뒤처진 패키지가 있다. 로그를 보고 'pnpm --filter @deckodecko/mobile exec expo install --fix' 로 맞춘다."
          fi

      # 시뮬레이터 없이 Metro 번들을 끝까지 돌려 import 경로·라우트 파일 규칙·네이티브 모듈 설정 오류를 잡는다.
      # 웹은 출시 대상이 아니다. 이 단계는 번들 검증용이다.
      - name: Expo web bundle (Metro 검증)
        run: pnpm --filter @deckodecko/mobile exec expo export --platform web --output-dir dist
