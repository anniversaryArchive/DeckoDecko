name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행 (PR 없이 확인용)

# 워크플로가 저장소를 읽기만 하도록 토큰 권한을 최소로 제한한다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  check:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # package.json 의 packageManager(pnpm@10.x) 를 그대로 사용
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: Lint + Typecheck (turbo)
        run: pnpm turbo run lint typecheck

      # 단위 테스트(vitest). test 스크립트가 있는 패키지만 돈다 (지금은 packages/core).
      - name: Test (turbo)
        run: pnpm turbo run test

      - name: Build (turbo)
        run: pnpm turbo run build

      # doctor 의 패키지 버전 비교는 실행 시점에 Expo 서버의 최신 권장 버전과 맞춰 보므로, 레포가 그대로여도 Expo 가 패치를 내면 깨진다.
      # 그 검사 하나만 빼고 나머지 doctor 검사(설정 · 중복 의존성 등)는 계속 막는다.
      - name: Expo doctor (버전 비교 제외)
        run: pnpm --filter @deckodecko/mobile run doctor
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"

      # 빠진 버전 비교는 여기서 lockfile 기준으로 다시 막는다. EXPO_OFFLINE=1 이면 Expo 서버 대신
      # lockfile 에 고정된 expo 패키지의 bundledNativeModules.json 과 비교하므로, 결과는 lockfile 이 바뀔 때만 달라진다.
      # 실패하면 `pnpm --filter @deckodecko/mobile exec expo install --fix` 로 맞춘다.
      # Expo 가 새로 내는 권장 패치를 따라가는 건 주간 workflow(expo-weekly-update.yml)가 맡는다.
      - name: Expo 패키지 버전 (lockfile 기준)
        run: pnpm --filter @deckodecko/mobile exec expo install --check
        env:
          EXPO_OFFLINE: "1"

      # 시뮬레이터 없이 Metro 번들을 끝까지 돌려 import 경로·라우트 파일 규칙·네이티브 모듈 설정 오류를 잡는다.
      # 웹은 출시 대상이 아니다. 이 단계는 번들 검증용이다.
      - name: Expo web bundle (Metro 검증)
        run: pnpm --filter @deckodecko/mobile exec expo export --platform web --output-dir dist
