name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행 (PR 없이 확인용)

# 워크플로가 저장소를 읽기만 하도록 토큰 권한을 최소로 제한한다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  check:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # package.json 의 packageManager(pnpm@10.x) 를 그대로 사용
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: Lint + Typecheck (turbo)
        run: pnpm turbo run lint typecheck

      - name: Build (turbo)
        run: pnpm turbo run build

      # doctor 검사 중 셋은 실행 시점의 외부 서버 응답에 따라 결과가 바뀌어, 레포가 그대로여도 CI 가 깨질 수 있다.
      # - 패키지 버전 비교: Expo 서버의 최신 권장 버전과 맞춰 본다 → 뺀다 (아래 lockfile 기준 단계가 대신 막는다)
      # - React Native Directory: reactnative.directory 를 조회한다 → 뺀다 (아래 경고 단계에서 따로 돌린다)
      # - Expo config 스키마: exp.host 에서 스키마를 받아 온다 → 남기되, 서버에 닿지 못한 실패만 경고로 넘긴다
      #   (WARN_ON_NETWORK_ERRORS 는 실패한 검사가 모두 네트워크 오류일 때만 통과시키므로, 다른 검사 실패는 계속 막는다)
      # 나머지 doctor 검사(설정 · 중복 의존성 등)는 그대로 막는다.
      - name: Expo doctor (외부 조회 검사 제외)
        run: pnpm --filter @deckodecko/mobile run doctor
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
          EXPO_DOCTOR_ENABLE_DIRECTORY_CHECK: "0"
          EXPO_DOCTOR_WARN_ON_NETWORK_ERRORS: "1"

      # Directory 검사는 새 패키지를 넣을 때 알아 두면 좋은 정보라 돌리되 막지 않는다 (#129).
      # 이 검사는 서버 연결 실패를 일반 실패로 돌려서 WARN_ON_NETWORK_ERRORS 로는 걸러지지 않는다 (expo-doctor 1.20.4).
      # 그래서 실패하면 노란 어노테이션만 남기고 통과한다. doctor 를 통째로 다시 돌리므로 다른 원인으로 실패할 수도 있어,
      # 어노테이션에는 Directory 가 걸린 줄을 그대로 옮기고, 없으면 로그를 보라고만 적는다.
      # Directory 요청에는 타임아웃이 없어 서버가 응답하지 않으면 오래 기다리므로, 단계에 시간 제한을 둔다.
      - name: React Native Directory (경고만)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          if ! out=$(pnpm --filter @deckodecko/mobile run doctor 2>&1); then
            echo "$out"
            reason=$(echo "$out" | grep -E 'Unsupported on New Architecture|Untested on New Architecture|Unmaintained|No metadata|Directory check failed' | tr '\n' ' ')
            echo "::warning title=expo doctor (Directory 포함)::${reason:-doctor 가 실패했습니다. 이 단계의 로그를 확인하세요.}"
          else
            echo "$out"
          fi
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
          EXPO_DOCTOR_ENABLE_DIRECTORY_CHECK: "1"
          EXPO_DOCTOR_WARN_ON_NETWORK_ERRORS: "1"

      # 빠진 버전 비교는 여기서 lockfile 기준으로 다시 막는다. EXPO_OFFLINE=1 이면 Expo 서버 대신
      # lockfile 에 고정된 expo 패키지의 bundledNativeModules.json 과 비교하므로, 결과는 lockfile 이 바뀔 때만 달라진다.
      # 실패하면 `pnpm --filter @deckodecko/mobile exec expo install --fix` 로 맞춘다.
      # Expo 가 새로 내는 권장 패치를 따라가는 건 주간 workflow(expo-weekly-update.yml)가 맡는다.
      - name: Expo 패키지 버전 (lockfile 기준)
        run: pnpm --filter @deckodecko/mobile exec expo install --check
        env:
          EXPO_OFFLINE: "1"

      # 시뮬레이터 없이 Metro 번들을 끝까지 돌려 import 경로·라우트 파일 규칙·네이티브 모듈 설정 오류를 잡는다.
      # 웹은 출시 대상이 아니다. 이 단계는 번들 검증용이다.
      - name: Expo web bundle (Metro 검증)
        run: pnpm --filter @deckodecko/mobile exec expo export --platform web --output-dir dist
