name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**" # 임시: PR 없이 작업 브랜치 push 로도 실행 (PR 열면 main 만 남겨도 됨)
  workflow_dispatch: # Actions 탭에서 수동 실행 (PR 없이 확인용)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  check:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # package.json 의 packageManager(pnpm@10.x) 를 그대로 사용
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: Lint + Typecheck (turbo)
        run: pnpm turbo run lint typecheck

      - name: Build (turbo)
        run: pnpm turbo run build
